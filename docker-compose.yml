services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: talentbridge
      POSTGRES_USER: talentbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentbridge -d talentbridge"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build: .
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DATABASE_URL: postgres://talentbridge:${POSTGRES_PASSWORD}@db:5432/talentbridge
      REDIS_URL: redis://redis:6379/1
      RESUME_STORAGE_DIR: /app/private_media/resumes
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_media:/app/private_media
      - public_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live/')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  postgres_data:
  private_media:
  public_media:
