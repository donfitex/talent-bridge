name: TalentBridge CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: talentbridge_test
          POSTGRES_USER: talentbridge_test
          POSTGRES_PASSWORD: test-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U talentbridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings.testing_postgres
      TEST_DATABASE_URL: postgres://talentbridge_test:test-password@localhost:5432/talentbridge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: coverage run -m pytest -o addopts=--strict-markers
      - run: coverage report --fail-under=70
      - run: python manage.py spectacular --file /tmp/openapi.yaml --validate
      - run: python manage.py collectstatic --noinput
      - run: docker build -t talentbridge:ci .
