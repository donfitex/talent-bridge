name: Sync external jobs
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"
permissions:
  contents: read
concurrency:
  group: external-job-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.EXTERNAL_JOBS_DATABASE_URL }}
      DJANGO_SETTINGS_MODULE: config.settings.base
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check database configuration
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'EXTERNAL_JOBS_DATABASE_URL is required'"
      - run: pip install -r requirements.txt
      - run: python manage.py seed_categories
      - run: python manage.py sync_external_jobs --all-categories --country Nigeria --location Nigeria --results 5 --shard-count 8 --shard-index ${{ matrix.shard }} --include-local --local-limit 5
