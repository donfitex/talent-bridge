services:
- type: web
  name: talentbridge-web
  runtime: docker
  region: ohio
  plan: free
  branch: main
  repo: https://github.com/donfitex/talent-bridge
  autoDeployTrigger: checksPass
  healthCheckPath: /health/
  envVars:
  - key: DJANGO_SETTINGS_MODULE
    value: config.settings.production
  - key: DJANGO_SECRET_KEY
    generateValue: true
  - key: DJANGO_ALLOWED_HOSTS
    value: localhost,127.0.0.1
  - key: WEB_CONCURRENCY
    value: '1'
  - key: EMAIL_BACKEND
    value: django.core.mail.backends.smtp.EmailBackend
  - key: EMAIL_HOST
    value: smtp-relay.brevo.com
  - key: EMAIL_PORT
    value: '2525'
  - key: EMAIL_HOST_USER
    sync: false
  - key: EMAIL_HOST_PASSWORD
    sync: false
  - key: EMAIL_USE_TLS
    value: 'True'
  - key: DEFAULT_FROM_EMAIL
    sync: false
  - key: AWS_ACCESS_KEY_ID
    sync: false
  - key: AWS_ENDPOINT_URL_S3
    sync: false
  - key: AWS_SECRET_ACCESS_KEY
    sync: false
  - key: DATABASE_URL
    sync: false
  - key: DATABASE_URL_UNPOOLED
    sync: false
  - key: RESUME_STORAGE_BACKEND
    value: neon
  - key: NEON_STORAGE_BUCKET
    value: uploads
  - key: AWS_REGION
    value: us-east-2
  - key: CONN_MAX_AGE
    value: '0'
  - key: CACHE_BACKEND
    value: database
  dockerCommand: python scripts/start.py
