<div class="mt-4 border-top pt-3"><h2 class="h6">Share this job</h2><div class="d-flex flex-wrap gap-3">{% for label, link in share_links %}<a href="{{ link }}" {% if label != 'Email' %}target="_blank" rel="noopener noreferrer"{% endif %}>{{ label }}</a>{% endfor %}<button class="btn btn-outline-secondary btn-sm" type="button" onclick="window.print()">Print job</button></div></div>
