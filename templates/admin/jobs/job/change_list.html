{% extends "admin/change_list.html" %}

{% block object-tools-items %}
  {% if perms.jobs.change_job %}
    <li>
      <form method="post" action="{% url 'admin:jobs_job_publish_all' %}">
        {% csrf_token %}
        <button type="submit" class="button" title="Publish every draft and pending-review job across all pages">
          Publish all unpublished jobs
        </button>
      </form>
    </li>
  {% endif %}
  {{ block.super }}
{% endblock %}
